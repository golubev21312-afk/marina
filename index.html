<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Установка на телефон (значок на экране) и работа без сети — public/sw.js -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Цвет строки браузера на телефоне — как --theme-color «Малахита» (tokens.css); «Белую» ставит theme-init.js -->
    <meta name="theme-color" content="#0f3328" />

    <!-- Тема ставится до первой отрисовки, иначе мигнёт светлая (public/theme-init.js) -->
    <script src="/theme-init.js"></script>

    <title>Крафт — мастерская подарков ручной работы в Нижнем Тагиле</title>
    <meta
      name="description"
      content="Авторские изделия из дерева с ручной росписью: неваляшки, матрёшки, ангелы-хранители, дрифтвуд. Мастерская «Крафт», Нижний Тагил. Подарок, который не завянет и не забудется."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Крафт — эксклюзивные подарки ручной работы" />
    <meta
      property="og:description"
      content="Дерево обретает вторую жизнь, а ручная роспись превращает его в уникальный подарок."
    />
    <meta property="og:locale" content="ru_RU" />

    <!-- Шрифты — свои, из /fonts (src/styles/fonts.css), не с Google -->
    <link rel="preload" href="/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
