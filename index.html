<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a241d" />

    <!-- Тема ставится до первой отрисовки, иначе мигнёт светлая. Ключ — как в src/theme/theme.js -->
    <script>
      (function () {
        // Сначала — тема по умолчанию: даже если хранилище недоступно
        document.documentElement.dataset.theme = 'malachite';
        try {
          // ?theme=malachite в адресе — открыть сразу в нужной теме (и запомнить)
          var fromUrl = new URLSearchParams(location.search).get('theme');
          if (fromUrl) localStorage.setItem('craft-theme', fromUrl);
          // По умолчанию — «Малахит»; «Белая» (kraft) — если человек её выбрал
          var theme = localStorage.getItem('craft-theme') === 'kraft' ? 'kraft' : 'malachite';
          document.documentElement.dataset.theme = theme;
          if (theme === 'kraft') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f1e7d4');
          }
        } catch (e) {}
      })();
    </script>

    <title>Крафт — мастерская подарков ручной работы в Нижнем Тагиле</title>
    <meta
      name="description"
      content="Авторские изделия из дерева с ручной росписью: неваляшки, матрёшки, ангелы-хранители, дрифтвуд. Мастерская «Крафт», Нижний Тагил. Подарок, который не завянет и не забудется."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Крафт — эксклюзивные подарки ручной работы" />
    <meta
      property="og:description"
      content="Дерево обретает вторую жизнь, а ручная роспись превращает его в уникальный подарок."
    />
    <meta property="og:locale" content="ru_RU" />

    <!-- Шрифты — свои, из /fonts (src/styles/fonts.css), не с Google -->
    <link rel="preload" href="/fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
